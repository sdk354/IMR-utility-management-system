# ===============================
# Database Configuration (SQL Server)
# ===============================
# 1. Changed 'localhost' to 'db' (the service name in docker-compose)
# 2. Using ${VARIABLE:fallback} syntax so Docker can inject the password
spring.datasource.url=jdbc:sqlserver://db:1433;databaseName=UtilityDB;encrypt=false
spring.datasource.username=SA
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yourStrongPassword123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true

# ===============================
# JWT Configuration
# ===============================
jwt.secret=ThisIsAReallyLongSecretKeyRequiredByTheHS512Algorithm64Characters!
jwt.expiration.ms=86400000

# ===============================
# Custom Import Settings
# ===============================
import.reading.max-value=1000000
import.reading.max-jump-percent=50

# Force detailed logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
server.error.include-message=always
server.error.include-stacktrace=always